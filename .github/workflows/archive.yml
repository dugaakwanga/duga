name: Data archival

# Keeps the free-tier Postgres database small over years of use: moves old
# audit-log and read-notification rows out to a compressed export in R2, then
# deletes them from the live database. See packages/db/scripts/archive.mjs.
# Requires the same R2_* secrets as backup.yml, plus DATABASE_URL (the pooled
# connection string, packages/db/.env / apps/portal/.env).
# If R2 secrets are missing, the script logs and skips archiving for that
# run rather than deleting rows with nowhere to put them.

on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of each month
  workflow_dispatch: {}

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: packages/db
        run: npm install --omit=dev --no-save @prisma/client @aws-sdk/client-s3

      - name: Generate Prisma client
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx --yes prisma generate

      - name: Run archival job
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: node scripts/archive.mjs
